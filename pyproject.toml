[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slimg"
version = "0.1.0"
description = "SlimG: Accurate, Robust, and Interpretable Graph Mining"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gdown>=4.5.3",
    "numpy>=1.23.3",
    "ogb>=1.3.5",
    "pandas>=1.5.1",
    "scikit-learn>=1.1.3",
    "scipy>=1.9.3",
    "torch>=2.1.0",
    "torch-geometric>=2.6.1",
    "tqdm>=4.64.1",
]

[tool.setuptools.packages.find]
include = ["slimg*"]

[project.scripts]
slimg = "slimg.slimg:main"
slimg-experiments = "slimg.run_all_experiments:main"
